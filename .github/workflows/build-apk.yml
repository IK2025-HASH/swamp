name: Build APK

on:
  push:
    branches:
      - claude/android-file-sharing-app-jNDL3
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      # ── 1. Source ────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Java ──────────────────────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ── 3. Python ────────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ── 4. System packages ───────────────────────────────────────────
      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            git zip unzip \
            autoconf automake libtool pkg-config \
            build-essential libssl-dev libffi-dev \
            zlib1g-dev libncurses-dev \
            cmake libgdbm-dev libsqlite3-dev \
            libzbar0 libzbar-dev \
            ccache

      # ── 5. Android SDK (provides a working sdkmanager) ───────────────
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # ── 6. Install packages into ANDROID_HOME ────────────────────────
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "build-tools;37.0.0" "platforms;android-33" "ndk;25.1.8937393"

      # ── 7. Pre-populate Buildozer's SDK directory ────────────────────
      #
      #   Buildozer keeps its OWN copy of the Android SDK at
      #   ~/.buildozer/android/platform/android-sdk — completely separate
      #   from ANDROID_HOME.  If that directory already exists when
      #   buildozer starts, it skips its own download and uses what's there.
      #
      #   Strategy:
      #     a) Copy cmdline-tools from ANDROID_HOME → buildozer SDK dir
      #     b) Create the legacy tools/bin/sdkmanager symlink p4a expects
      #     c) Accept all licenses inside the buildozer SDK dir
      #     d) Pre-install build-tools;37.0.0 + platforms;android-33 there
      #     e) Symlink NDK (saves the 1 GB download)
      #
      - name: Pre-populate Buildozer SDK + NDK directories
        run: |
          SDK="$HOME/.buildozer/android/platform/android-sdk"
          mkdir -p "$SDK/cmdline-tools"

          # (a) copy cmdline-tools
          cp -r "$ANDROID_HOME/cmdline-tools/latest" "$SDK/cmdline-tools/"

          # (b) legacy sdkmanager path expected by python-for-android
          mkdir -p "$SDK/tools/bin"
          ln -sf "$SDK/cmdline-tools/latest/bin/sdkmanager" "$SDK/tools/bin/sdkmanager"

          # (c) accept all licenses inside buildozer's SDK
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            --sdk_root="$SDK" --licenses || true

          # (d) pre-install the packages p4a will request
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" \
            "build-tools;37.0.0" "platforms;android-33"

          # (e) symlink NDK so buildozer skips the 1 GB NDK download
          ln -sf "$ANDROID_HOME/ndk/25.1.8937393" \
                 "$HOME/.buildozer/android/platform/android-ndk-r25b"

          echo "=== SDK layout ==="
          ls "$SDK/"
          echo "=== build-tools ==="
          ls "$SDK/build-tools/" || echo "(none yet)"

      # ── 8. Buildozer ─────────────────────────────────────────────────
      - name: Install Buildozer
        run: |
          pip install --upgrade pip
          pip install buildozer cython

      # ── 9. Cache compiled p4a recipes (expensive; reused across runs) ─
      - name: Cache .buildozer dir
        uses: actions/cache@v4
        with:
          path: .buildozer
          key: buildozer-${{ hashFiles('buildozer.spec', 'requirements.txt') }}
          restore-keys: buildozer-

      # ── 10. Build ────────────────────────────────────────────────────
      - name: Build debug APK
        run: buildozer android debug

      # ── 11. Artifact ─────────────────────────────────────────────────
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: swamp-debug-apk
          path: bin/*.apk
          retention-days: 30
