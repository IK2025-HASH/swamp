name: Build APK

on:
  push:
    branches:
      - claude/android-file-sharing-app-jNDL3
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      # ── 1. Source ────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Java ──────────────────────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ── 3. Python ────────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ── 4. System packages ───────────────────────────────────────────
      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            git zip unzip \
            autoconf automake libtool pkg-config \
            build-essential libssl-dev libffi-dev \
            zlib1g-dev libncurses-dev \
            cmake libgdbm-dev libsqlite3-dev \
            libzbar0 libzbar-dev \
            ccache

      # ── 5. Android SDK via official action ───────────────────────────
      #       This gives us a modern SDK with cmdline-tools at the correct path.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # ── 6. Install required SDK packages + accept all licenses ───────
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "build-tools;34.0.0" "platforms;android-33" "ndk;25.1.8937393"

      # ── 7. Compatibility shim ────────────────────────────────────────
      #       Buildozer/p4a looks for sdkmanager at the legacy path
      #       tools/bin/sdkmanager; newer SDK ships it under cmdline-tools.
      #       A symlink bridges the gap without patching python-for-android.
      - name: Create legacy sdkmanager symlink for Buildozer
        run: |
          mkdir -p "$ANDROID_HOME/tools/bin"
          ln -sf "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
                 "$ANDROID_HOME/tools/bin/sdkmanager"

      # ── 8. Buildozer ─────────────────────────────────────────────────
      - name: Install Buildozer
        run: |
          pip install --upgrade pip
          pip install buildozer cython

      # ── 9. Cache built artefacts (NDK compile etc.) ──────────────────
      - name: Cache .buildozer dir
        uses: actions/cache@v4
        with:
          path: .buildozer
          key: buildozer-${{ hashFiles('buildozer.spec', 'requirements.txt') }}
          restore-keys: buildozer-

      # ── 10. Tell Buildozer to use the pre-installed SDK + NDK ────────
      - name: Patch buildozer.spec with pre-installed SDK/NDK paths
        run: |
          echo "android.sdk_path = $ANDROID_HOME" >> buildozer.spec
          echo "android.ndk_path = $ANDROID_HOME/ndk/25.1.8937393" >> buildozer.spec

      # ── 11. Build ────────────────────────────────────────────────────
      - name: Build debug APK
        run: buildozer android debug

      # ── 12. Artifact ─────────────────────────────────────────────────
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: swamp-debug-apk
          path: bin/*.apk
          retention-days: 30
