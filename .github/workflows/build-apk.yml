name: Build APK

on:
  push:
    branches:
      - claude/android-file-sharing-app-jNDL3
      - main
  workflow_dispatch:   # lets you trigger a build manually from the Actions tab

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      # ── 1. Source ────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Java (Android SDK tooling needs JDK 17) ───────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ── 3. Python ────────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ── 4. System packages needed by Buildozer + pyzbar ─────────────
      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            git zip unzip \
            autoconf automake libtool pkg-config \
            build-essential libssl-dev libffi-dev \
            zlib1g-dev libncurses-dev \
            cmake libgdbm-dev libsqlite3-dev \
            libzbar0 libzbar-dev \
            ccache

      # ── 5. Buildozer + Cython ────────────────────────────────────────
      - name: Install Buildozer
        run: |
          pip install --upgrade pip
          pip install buildozer cython

      # ── 6. Cache .buildozer (SDK, NDK, Python-for-android recipes) ───
      #       Key changes only when buildozer.spec or requirements change,
      #       so the ~2 GB download is reused across runs.
      - name: Cache Buildozer global dir
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-global-${{ hashFiles('buildozer.spec', 'requirements.txt') }}
          restore-keys: buildozer-global-

      - name: Cache local .buildozer dir
        uses: actions/cache@v4
        with:
          path: .buildozer
          key: buildozer-local-${{ hashFiles('buildozer.spec', 'requirements.txt') }}
          restore-keys: buildozer-local-

      # ── 7. Pre-accept Android SDK licenses ──────────────────────────
      #       Buildozer installs the SDK to ~/.buildozer/android/platform/android-sdk.
      #       Pre-creating the license files prevents sdkmanager from refusing
      #       to install build-tools because licences weren't accepted interactively.
      - name: Pre-accept Android SDK licenses
        run: |
          mkdir -p ~/.buildozer/android/platform/android-sdk/licenses
          printf '\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n' \
            > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
          printf '\n84831b9409646a918e30573bab4c9c91346d8abd\n' \
            > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-preview-license
          printf '\nd975f751698a77b662f1254ddbeed3901e976f5a\n' \
            > ~/.buildozer/android/platform/android-sdk/licenses/intel-android-extra-license
          printf '\n33b6a2b64607f11b759f320ef9dff4ae5c47d97a\n' \
            > ~/.buildozer/android/platform/android-sdk/licenses/mips-android-sysimage-license

      # ── 8. Build debug APK ───────────────────────────────────────────
      - name: Build debug APK
        run: buildozer android debug

      # ── 8. Upload APK as downloadable artifact ───────────────────────
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: swamp-debug-apk
          path: bin/*.apk
          retention-days: 30
